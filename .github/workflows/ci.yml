name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify skills lock and layout
        run: node scripts/skills.mjs verify

      - name: Verify OpenCode symlink
        run: |
          test "$(readlink .opencode/skills)" = "../.pi/skills"
          test -f .pi/extensions/plan-build-mode.ts
          test -f .pi/settings.json
          test -f skills-lock.json

      - name: Validate installer syntax
        run: bash -n get-started.sh

      - name: Test installer (fresh, repeat, conflict)
        run: bash scripts/test-install.sh
