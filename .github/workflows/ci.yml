name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y just

      - name: Run tests
        run: just test
