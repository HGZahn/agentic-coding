name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate manifest and launchers
        run: |
          node --check scripts/agentic.mjs
          ./agentic profiles
          bash -n agentic setup.sh get-started.sh home/.local/bin/agentic

      - name: Run isolated installer and bootstrap regression tests
        run: node --test tests/*.test.mjs
