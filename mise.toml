[tools]
node = "lts"

[tasks.setup]
description = "Install personal skills (alias of setup-all; kept for compatibility)"
run = "./agentic install --user"

[tasks.setup-all]
description = "Install personal skills"
run = "./agentic install --user"

[tasks.doctor]
description = "Report missing skills without changing"
run = "./agentic doctor --user"

[tasks.skills-update]
description = "Update all global skills"
run = "./agentic skills update --user"

[tasks.skills-list]
description = "List installed global skills"
run = "./agentic skills list --user"

[tasks.init]
description = "Init a project: mise run init /path/to/repo"
run = "./agentic install --project"

[tasks.init-local]
description = "Init a project with Pi skills: mise run init-local /path/to/repo"
run = "./agentic install --agents pi --project"

[tasks.update]
description = "Fast-forward installer checkout, then sync personal config and skills"
run = "./agentic update --user"

[tasks.profiles]
description = "Show available skill profiles"
run = "./agentic profiles"

[tasks.test]
description = "Run isolated installer and bootstrap regression tests"
run = "node --test tests/*.test.mjs"