# via the local opencode serve --service bridge (port 49374).
# Direct-HTTP to opencode.ai is DEAD (403 FreeTierError).
# The plugin proxies through the local bridge; no opencode dependency.
- insert:
    - id: opencode-free-live
      name: opencode-free-live
      config:
        bridgeBaseUrl: http://127.0.0.1:49374
